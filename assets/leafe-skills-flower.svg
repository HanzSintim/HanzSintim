<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="100%" height="100%">
  <defs>
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <linearGradient id="radarFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="barIndigoCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="barAmberRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <style>
      .orbit-ring {
        transform-origin: 155px 220px;
        animation: spinSlow 28s linear infinite;
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <rect width="1200" height="410" rx="24" fill="#060810" stroke="#1e293b" stroke-width="2" />

  <!-- LEFT BENTO CARD: EXECUTIVE LEADERSHIP & ACADEMIC GOVERNANCE -->
  <g transform="translate(24, 22)">
    <rect width="560" height="366" rx="20" fill="url(#cardSurface)" stroke="#334155" stroke-opacity="0.7" />
    <rect x="0" y="0" width="180" height="3" fill="url(#barIndigoCyan)" />

    <text x="28" y="36" fill="#38bdf8" font-family="Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.4">
      EXECUTIVE GOVERNANCE &amp; LEADERSHIP DOSSIER
    </text>
    <text x="28" y="62" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">
      Engineering Leadership Across Ghana 🇬🇭 &amp; France 🇫🇷
    </text>

    <!-- Role 1 -->
    <g transform="translate(26, 84)">
      <rect width="508" height="80" rx="14" fill="#090e1a" stroke="#6366f1" stroke-opacity="0.45" />
      <rect width="4" height="80" rx="2" fill="#6366f1" />
      <text x="20" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800">
        Department President — ACES KNUST (Kumasi, Ghana)
      </text>
      <rect x="412" y="11" width="82" height="20" rx="10" fill="#1e1b4b" />
      <text x="453" y="25" text-anchor="middle" fill="#a5b4fc" font-family="Consolas, monospace" font-size="9.5" font-weight="700">2024–2025</text>
      <text x="20" y="47" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">
        Chief executive representative for 800+ Computer Engineering undergraduates.
      </text>
      <text x="20" y="65" fill="#67e8f9" font-family="Consolas, monospace" font-size="10.5">
        ▸ Led ACES Tech Week · Codefest · Departmental Software Repositories
      </text>
    </g>

    <!-- Role 2 -->
    <g transform="translate(26, 176)">
      <rect width="508" height="80" rx="14" fill="#090e1a" stroke="#06b6d4" stroke-opacity="0.45" />
      <rect width="4" height="80" rx="2" fill="#06b6d4" />
      <text x="20" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800">
        Strategic Planning &amp; Organizing Lead — GHAFRA Nord (Lille)
      </text>
      <rect x="412" y="11" width="82" height="20" rx="10" fill="#082f49" />
      <text x="453" y="25" text-anchor="middle" fill="#67e8f9" font-family="Consolas, monospace" font-size="9.5" font-weight="700">2025–Pres.</text>
      <text x="20" y="47" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">
        Architects operational roadmaps &amp; scholar integration across Hauts-de-France.
      </text>
      <text x="20" y="65" fill="#a5b4fc" font-family="Consolas, monospace" font-size="10.5">
        ▸ Franco-Ghanaian Academic &amp; Engineering Institutional Network
      </text>
    </g>

    <!-- Role 3 -->
    <g transform="translate(26, 268)">
      <rect width="508" height="76" rx="14" fill="#090e1a" stroke="#f59e0b" stroke-opacity="0.45" />
      <rect width="4" height="76" rx="2" fill="#f59e0b" />
      <text x="20" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800">
        Co-Lead, Commercial &amp; Hardware Operations — H &amp; D'S HUB
      </text>
      <rect x="412" y="11" width="82" height="20" rx="10" fill="#451a03" />
      <text x="453" y="25" text-anchor="middle" fill="#fcd34d" font-family="Consolas, monospace" font-size="9.5" font-weight="700">2023–Pres.</text>
      <text x="20" y="47" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">
        International hardware procurement, pre-shipment device diagnostics &amp; logistics.
      </text>
      <text x="20" y="64" fill="#fcd34d" font-family="Consolas, monospace" font-size="10.5">
        ▸ Unit-Economics Pricing · Supply-Chain &amp; Inventory Operations
      </text>
    </g>
  </g>

  <!-- RIGHT BENTO CARD: HEXAGONAL RADAR & QUANTITATIVE TELEMETRY MATRIX -->
  <g transform="translate(608, 22)">
    <rect width="568" height="366" rx="20" fill="url(#cardSurface)" stroke="#334155" stroke-opacity="0.7" />
    <rect x="0" y="0" width="180" height="3" fill="url(#barAmberRose)" />

    <text x="28" y="36" fill="#f59e0b" font-family="Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.4">
      MULTI-DOMAIN RADAR TELEMETRY // 92.8% COMPOSITE MASTERY
    </text>
    <text x="28" y="62" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">
      Quantitative Subject &amp; Architecture Matrix
    </text>

    <!-- Animated Hexagonal Radar Diagram -->
    <circle cx="155" cy="220" r="102" fill="none" stroke="#334155" stroke-dasharray="5 4" class="orbit-ring" />
    <circle cx="155" cy="220" r="72" fill="none" stroke="#1e293b" />
    <line x1="155" y1="118" x2="155" y2="322" stroke="#1e293b" />
    <line x1="67" y1="169" x2="243" y2="271" stroke="#1e293b" />
    <line x1="243" y1="169" x2="67" y2="271" stroke="#1e293b" />

    <!-- Radar Polygon -->
    <polygon points="155,124 236,172 232,265 155,312 78,263 72,170" fill="url(#radarFill)" stroke="#38bdf8" stroke-width="2.2" />

    <!-- 6 Orbital Labels -->
    <circle cx="155" cy="124" r="18" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
    <text x="155" y="128" text-anchor="middle" fill="#a5b4fc" font-family="Consolas, monospace" font-size="9.5" font-weight="700">PY</text>

    <circle cx="236" cy="172" r="18" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
    <text x="236" y="176" text-anchor="middle" fill="#67e8f9" font-family="Consolas, monospace" font-size="9.5" font-weight="700">C++</text>

    <circle cx="232" cy="265" r="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="232" y="269" text-anchor="middle" fill="#fcd34d" font-family="Consolas, monospace" font-size="9.5" font-weight="700">MCU</text>

    <circle cx="155" cy="312" r="18" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <text x="155" y="316" text-anchor="middle" fill="#f472b6" font-family="Consolas, monospace" font-size="9.5" font-weight="700">3NF</text>

    <circle cx="78" cy="263" r="18" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <text x="78" y="267" text-anchor="middle" fill="#d8b4fe" font-family="Consolas, monospace" font-size="9.5" font-weight="700">PCB</text>

    <circle cx="72" cy="170" r="18" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <text x="72" y="174" text-anchor="middle" fill="#6ee7b7" font-family="Consolas, monospace" font-size="9.5" font-weight="700">OPS</text>

    <circle cx="155" cy="220" r="24" fill="#090d18" stroke="#f8fafc" stroke-width="1.8" />
    <text x="155" y="224" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="9.5" font-weight="800">92.8%</text>

    <!-- Right-Half Skill Bars -->
    <g transform="translate(298, 92)">
      <text x="0" y="14" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">01. Python 3.12, Flask &amp; REST APIs</text>
      <text x="242" y="14" text-anchor="end" fill="#818cf8" font-family="Consolas, monospace" font-size="11.5" font-weight="700">95%</text>
      <rect x="0" y="21" width="242" height="7" rx="3.5" fill="#090e1a" />
      <rect x="0" y="21" width="230" height="7" rx="3.5" fill="url(#barIndigoCyan)" />

      <text x="0" y="56" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">02. C / C++17 OOP &amp; POS Systems</text>
      <text x="242" y="56" text-anchor="end" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5" font-weight="700">94%</text>
      <rect x="0" y="63" width="242" height="7" rx="3.5" fill="#090e1a" />
      <rect x="0" y="63" width="227" height="7" rx="3.5" fill="url(#barIndigoCyan)" />

      <text x="0" y="98" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">03. SQL &amp; 3NF Relational Modeling</text>
      <text x="242" y="98" text-anchor="end" fill="#f472b6" font-family="Consolas, monospace" font-size="11.5" font-weight="700">92%</text>
      <rect x="0" y="105" width="242" height="7" rx="3.5" fill="#090e1a" />
      <rect x="0" y="105" width="223" height="7" rx="3.5" fill="url(#barAmberRose)" />

      <text x="0" y="140" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">04. STM32, ESP32 &amp; Embedded C</text>
      <text x="242" y="140" text-anchor="end" fill="#fbbf24" font-family="Consolas, monospace" font-size="11.5" font-weight="700">91%</text>
      <rect x="0" y="147" width="242" height="7" rx="3.5" fill="#090e1a" />
      <rect x="0" y="147" width="220" height="7" rx="3.5" fill="url(#barAmberRose)" />

      <text x="0" y="182" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">05. Cadence IC, KiCad PCB &amp; ToF</text>
      <text x="242" y="182" text-anchor="end" fill="#c084fc" font-family="Consolas, monospace" font-size="11.5" font-weight="700">89%</text>
      <rect x="0" y="189" width="242" height="7" rx="3.5" fill="#090e1a" />
      <rect x="0" y="189" width="215" height="7" rx="3.5" fill="url(#barIndigoCyan)" />

      <text x="0" y="224" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">06. Executive &amp; R&amp;D Leadership</text>
      <text x="242" y="224" text-anchor="end" fill="#34d399" font-family="Consolas, monospace" font-size="11.5" font-weight="700">96%</text>
      <rect x="0" y="231" width="242" height="7" rx="3.5" fill="#090e1a" />
      <rect x="0" y="231" width="233" height="7" rx="3.5" fill="url(#barAmberRose)" />
    </g>
  </g>
</svg>
