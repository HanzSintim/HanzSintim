    </text>
    <text x="26" y="58" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">
      Academic &amp; R&amp;D Telemetry Map
    </text>

    <g transform="translate(26, 74)">
      <rect width="516" height="232" rx="14" fill="#050811" stroke="#1e293b" />
      <line x1="0" y1="60" x2="516" y2="60" stroke="#1e293b" stroke-opacity="0.5" />
      <line x1="0" y1="120" x2="516" y2="120" stroke="#1e293b" stroke-opacity="0.5" />
      <line x1="0" y1="180" x2="516" y2="180" stroke="#1e293b" stroke-opacity="0.5" />
      <line x1="172" y1="0" x2="172" y2="232" stroke="#1e293b" stroke-opacity="0.5" />

      <!-- Stylized Europe & West Africa -->
      <path d="M 105,22 L 175,16 L 235,26 L 248,60 L 208,88 L 130,84 Z" fill="#111a2e" stroke="#6366f1" stroke-width="1.4" />
      <path d="M 82,118 L 195,112 L 242,158 L 218,218 L 142,214 L 88,180 Z" fill="#111a2e" stroke="#06b6d4" stroke-width="1.4" />

      <!-- Corridor Arc -->
      <path d="M 140,182 Q 92,115 170,54" fill="none" stroke="url(#flightStroke)" stroke-width="2.8" stroke-dasharray="6 4" />

      <!-- Animated Radar Pins -->
      <circle cx="170" cy="54" r="6" fill="#6366f1" class="radar-pulse" />
      <circle cx="170" cy="54" r="5.5" fill="#6366f1" stroke="#ffffff" stroke-width="1.5" />

      <circle cx="134" cy="166" r="6" fill="#06b6d4" class="radar-pulse" />
      <circle cx="134" cy="166" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" />

      <circle cx="142" cy="186" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2" />

      <!-- 3 Academic Cards on Map Right -->
      <g transform="translate(266, 14)">
        <rect width="234" height="60" rx="10" fill="#0b1120" stroke="#6366f1" stroke-opacity="0.55" />
        <text x="12" y="19" fill="#818cf8" font-family="Consolas, monospace" font-size="9.5" font-weight="700">🇫🇷 LILLE, FRANCE · 50.63°N, 3.06°E</text>
        <text x="12" y="36" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">JUNIA ISEN Lille — M1 Eng.</text>
        <text x="12" y="51" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">Microelectronics · GHAFRA Nord</text>
      </g>

      <g transform="translate(266, 84)">
        <rect width="234" height="60" rx="10" fill="#0b1120" stroke="#06b6d4" stroke-opacity="0.55" />
        <text x="12" y="19" fill="#38bdf8" font-family="Consolas, monospace" font-size="9.5" font-weight="700">🇬🇭 KUMASI, GHANA · 6.67°N, 1.57°W</text>
        <text x="12" y="36" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">KNUST — BSc Computer Eng.</text>
        <text x="12" y="51" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">ACES Department President</text>
      </g>

      <g transform="translate(266, 154)">
        <rect width="234" height="60" rx="10" fill="#0b1120" stroke="#f59e0b" stroke-opacity="0.55" />
        <text x="12" y="19" fill="#fbbf24" font-family="Consolas, monospace" font-size="9.5" font-weight="700">🇬🇭 ACCRA, GHANA · 5.65°N, 0.19°W</text>
        <text x="12" y="36" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="700">PRESEC-Legon (Odadeɛ '22)</text>
        <text x="12" y="51" fill="#94a3b8" font-family="Consolas, monospace" font-size="9.5">General Science Foundation</text>
      </g>
    </g>
  </g>
</svg>
