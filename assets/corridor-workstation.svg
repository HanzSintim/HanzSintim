<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="100%" height="100%">
  <defs>
    <linearGradient id="bentoSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
    <linearGradient id="flightStroke" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <style>
      .radar-pulse {
        animation: radarPing 2.4s ease-out infinite;
      }
      @keyframes radarPing {
        0% { r: 6px; opacity: 0.85; }
        100% { r: 20px; opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="370" rx="24" fill="#060810" stroke="#1e293b" stroke-width="2" />

  <!-- LEFT BENTO CARD: 3D WORKSTATION & PYTHON / C++17 DUAL ENGINE -->
  <g transform="translate(24, 20)">
    <rect width="564" height="330" rx="20" fill="url(#bentoSurface)" stroke="#334155" stroke-opacity="0.7" />
    <text x="26" y="34" fill="#818cf8" font-family="Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.4">
      3D SYSTEMS WORKBENCH // PYTHON 3.12 &amp; C++17 DUAL ARCHITECTURE
    </text>
    <text x="26" y="58" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">
      Live Code &amp; Algorithmic Telemetry Workstation
    </text>

    <!-- Laptop Monitor Frame -->
    <g transform="translate(42, 76)">
      <rect width="480" height="202" rx="14" fill="#050811" stroke="#6366f1" stroke-width="1.8" />
      <rect width="480" height="24" rx="14" fill="#0f172a" />
      <circle cx="16" cy="12" r="4" fill="#ef4444" />
      <circle cx="28" cy="12" r="4" fill="#f59e0b" />
      <circle cx="40" cy="12" r="4" fill="#10b981" />
      <text x="240" y="16" text-anchor="middle" fill="#93c5fd" font-family="Consolas, monospace" font-size="10">
        data_engine.py  ⇄  L'ECLERC.cpp  (Zero-Drift Centimes &amp; RTTI Scale)
      </text>

      <text x="18" y="48" fill="#38bdf8" font-family="Consolas, monospace" font-size="11" font-weight="700">
        # Python 3.12 &amp; C++17 Greedy Euro Change + French TVA (20%)
      </text>
      <text x="18" y="68" fill="#e2e8f0" font-family="Consolas, monospace" font-size="10.5">
        def compute_euro_checkout_simulation(amount_eur: float, cash_eur: float):
      </text>
      <text x="18" y="86" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">
            total_cents = int(round(amount_eur * 100))  # Anti-IEEE-754 drift
      </text>
      <text x="18" y="104" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">
            denoms = [5000, 2000, 1000, 500, 200, 100, 50, 20, 10, 5, 2, 1]
      </text>
      <text x="18" y="122" fill="#fcd34d" font-family="Consolas, monospace" font-size="10.5">
            # Paired with C++17 dynamic_cast&lt;Physicalproducts*&gt; Load-Cell Scale
      </text>

      <!-- 3 Mini System Pills -->
      <rect x="18" y="140" width="142" height="46" rx="10" fill="#0d1324" stroke="#6366f1" stroke-opacity="0.55" />
      <text x="28" y="158" fill="#818cf8" font-family="Consolas, monospace" font-size="9" font-weight="700">01 // PORTFOLIO API</text>
      <text x="28" y="175" fill="#f8fafc" font-family="Consolas, monospace" font-size="11" font-weight="700">Python 3 · Flask</text>

      <rect x="170" y="140" width="142" height="46" rx="10" fill="#0d1324" stroke="#06b6d4" stroke-opacity="0.55" />
      <text x="180" y="158" fill="#38bdf8" font-family="Consolas, monospace" font-size="9" font-weight="700">02 // E.LECLERC POS</text>
      <text x="180" y="175" fill="#f8fafc" font-family="Consolas, monospace" font-size="11" font-weight="700">C++17 · RTTI</text>

      <rect x="322" y="140" width="140" height="46" rx="10" fill="#0d1324" stroke="#f59e0b" stroke-opacity="0.55" />
      <text x="332" y="158" fill="#fbbf24" font-family="Consolas, monospace" font-size="9" font-weight="700">03 // URBAN ROBOT</text>
      <text x="332" y="175" fill="#f8fafc" font-family="Consolas, monospace" font-size="11" font-weight="700">STM32 + ESP32</text>
    </g>

    <rect x="18" y="278" width="528" height="12" rx="6" fill="#1e293b" stroke="#6366f1" stroke-opacity="0.5" />
  </g>

  <!-- RIGHT BENTO CARD: GHANA ⇄ FRANCE TELEMETRY CORRIDOR MAP -->
  <g transform="translate(608, 20)">
    <rect width="568" height="330" rx="20" fill="url(#bentoSurface)" stroke="#334155" stroke-opacity="0.7" />
    <text x="26" y="34" fill="#38bdf8" font-family="Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.4">
