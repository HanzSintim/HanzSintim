<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%">
  <defs>
    <linearGradient id="midnightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060810" />
      <stop offset="50%" stop-color="#0b101e" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <linearGradient id="auroraTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="bentoCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.96" />
    </linearGradient>

    <radialGradient id="indigoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <style>
      .pulse-led {
        animation: pulseLed 2.2s ease-in-out infinite;
      }
      .caret-blink {
        animation: blink 1s step-end infinite;
      }
      .float-badge-1 {
        animation: floatY 5s ease-in-out infinite;
      }
      .float-badge-2 {
        animation: floatY 6s ease-in-out infinite -2.5s;
      }
      @keyframes pulseLed {
        0%, 100% { opacity: 1; r: 5px; }
        50% { opacity: 0.45; r: 7px; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="430" rx="24" fill="url(#midnightBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient Aurora Glows -->
  <circle cx="240" cy="120" r="260" fill="url(#indigoGlow)" />
  <circle cx="960" cy="310" r="260" fill="url(#cyanGlow)" />

  <!-- =====================================================================
       BENTO CELL 1 (LEFT 740px): HERO IDENTITY & TYPEWRITER STATEMENT
       ===================================================================== -->
  <g transform="translate(24, 24)">
    <rect width="736" height="270" rx="20" fill="url(#bentoCardBg)" stroke="#334155" stroke-opacity="0.65" stroke-width="1.2" />
    <rect x="0" y="0" width="220" height="3" fill="url(#auroraTextGrad)" />

    <!-- Status Pill -->
    <g transform="translate(28, 26)">
      <rect width="485" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.45" />
      <circle cx="16" cy="14" r="5" fill="#10b981" class="pulse-led" />
      <text x="30" y="18" fill="#e2e8f0" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1">
        JUNIA ISEN LILLE (M1) 🇫🇷  ·  KNUST COMP. ENG (BSc) 🇬🇭  ·  ACES PRESIDENT
      </text>
    </g>

    <!-- Display Name & Gradient Headline -->
    <text x="28" y="102" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.8">
      Hanz Ofosuhene-Sintim
    </text>
    <text x="28" y="138" fill="url(#auroraTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800">
      Architecting Intelligent Software, Data &amp; Silicon Systems.
    </text>

    <!-- Animated Terminal Prompt Subtitle -->
    <text x="28" y="170" fill="#38bdf8" font-family="Consolas, monospace" font-size="13.5" font-weight="700">
      &gt; Python 3.12 &amp; Flask Architect · C++17 POS Engineer · STM32/ESP32 Firmware
    </text>
    <rect x="618" y="157" width="8" height="16" fill="#f59e0b" class="caret-blink" />

    <!-- Concise Narrative -->
    <text x="28" y="202" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
      Bridging expressive Python backend engineering, REST APIs, and 3NF relational databases with
    </text>
    <text x="28" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
      deterministic C++17 self-checkout terminals, Cadence IC design, and dual-MCU autonomous robotics.
    </text>

    <!-- Bottom Pill Strip -->
    <g transform="translate(28, 234)">
      <rect x="0" y="0" width="142" height="24" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.6" />
      <text x="71" y="16" text-anchor="middle" fill="#a5b4fc" font-family="Consolas, monospace" font-size="10.5" font-weight="700">🐍 Python 3.12 · 95%</text>

      <rect x="152" y="0" width="142" height="24" rx="8" fill="#082f49" stroke="#06b6d4" stroke-opacity="0.6" />
      <text x="223" y="16" text-anchor="middle" fill="#67e8f9" font-family="Consolas, monospace" font-size="10.5" font-weight="700">⚡ C++17 OOP · 94%</text>

      <rect x="304" y="0" width="156" height="24" rx="8" fill="#451a03" stroke="#f59e0b" stroke-opacity="0.6" />
      <text x="382" y="16" text-anchor="middle" fill="#fcd34d" font-family="Consolas, monospace" font-size="10.5" font-weight="700">🔌 STM32 / ESP32 · 91%</text>

      <rect x="470" y="0" width="148" height="24" rx="8" fill="#3b0764" stroke="#a855f7" stroke-opacity="0.6" />
      <text x="544" y="16" text-anchor="middle" fill="#d8b4fe" font-family="Consolas, monospace" font-size="10.5" font-weight="700">🗄️ 3NF SQL · 92%</text>
    </g>
  </g>

  <!-- =====================================================================
       BENTO CELL 2 (RIGHT 398px): INTERACTIVE CLI TERMINAL PREVIEW
       ===================================================================== -->
  <g transform="translate(778, 24)">
    <rect width="398" height="270" rx="20" fill="#050811" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1.2" />
    <!-- Window Chrome -->
    <circle cx="24" cy="22" r="5" fill="#ef4444" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" />
    <circle cx="56" cy="22" r="5" fill="#10b981" />
    <text x="208" y="26" text-anchor="middle" fill="#64748b" font-family="Consolas, monospace" font-size="10.5">
      hanz@junia-lille: ~/systems-workbench
    </text>
    <line x1="0" y1="38" x2="398" y2="38" stroke="#1e293b" />

    <!-- Terminal Lines -->
    <text x="20" y="64" fill="#10b981" font-family="Consolas, monospace" font-size="11.5" font-weight="700">
      $ python3 data_engine.py --profile
    </text>
    <text x="20" y="86" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11">
      {
    </text>
    <text x="34" y="105" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">
      "engineer": <tspan fill="#fcd34d">"Hanz Ofosuhene-Sintim"</tspan>,
    </text>
    <text x="34" y="124" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">
      "focus": [<tspan fill="#a5b4fc">"Python 3"</tspan>, <tspan fill="#67e8f9">"C++17"</tspan>, <tspan fill="#fcd34d">"STM32"</tspan>],
    </text>
    <text x="34" y="143" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">
      "grad_track": <tspan fill="#86efac">"JUNIA ISEN Lille (M1)"</tspan>,
    </text>
    <text x="34" y="162" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">
      "undergrad": <tspan fill="#86efac">"KNUST BSc CompEng"</tspan>,
    </text>
    <text x="34" y="181" fill="#93c5fd" font-family="Consolas, monospace" font-size="11">
