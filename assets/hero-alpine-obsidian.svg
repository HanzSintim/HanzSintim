      <text x="18" y="50" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="800">Polymorphic OOP</text>
      <text x="18" y="69" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">dynamic_cast · Greedy</text>
