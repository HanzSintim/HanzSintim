    </text>
    <text x="20" y="200" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11">
      }
    </text>

    <text x="20" y="228" fill="#10b981" font-family="Consolas, monospace" font-size="11.5" font-weight="700">
      $ g++ -Wall -Wextra L'ECLERC.cpp -o pos
    </text>
    <text x="20" y="248" fill="#38bdf8" font-family="Consolas, monospace" font-size="11">
      [OK] 0 warnings · RTTI Scale + Euro Greedy POS
    </text>
  </g>

