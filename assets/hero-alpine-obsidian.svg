      <stop offset="40%" stop-color="#6ee7b7" stop-opacity="0.65" />
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.82" />
    </radialGradient>
